name: CI

on:
  push:
    paths-ignore:
      - "ci-results/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only 2>&1 | tee ci-install.log
          npm ci 2>&1 | tee -a ci-install.log

      - name: Verify application
        id: app
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
        run: |
          set -euo pipefail
          npm run lint 2>&1 | tee ci-app.log
          npm run typecheck 2>&1 | tee -a ci-app.log
          npm test 2>&1 | tee -a ci-app.log
          npm run build 2>&1 | tee -a ci-app.log
          npm audit --omit=dev --audit-level=high 2>&1 | tee -a ci-app.log

      - name: Install Supabase CLI
        id: supabase_cli
        continue-on-error: true
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify database migrations and RLS
        id: database
        if: steps.supabase_cli.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          supabase start 2>&1 | tee ci-database.log
          supabase db reset 2>&1 | tee -a ci-database.log
          supabase test db 2>&1 | tee -a ci-database.log

      - name: Export local Supabase environment
        id: local_env
        if: steps.database.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY)=')"
          test -n "$API_URL"
          test -n "$ANON_KEY"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"

      - name: Verify protected CRM in browser
        id: e2e
        if: steps.install.outcome == 'success' && steps.database.outcome == 'success' && steps.local_env.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium webkit 2>&1 | tee ci-e2e.log
          npm run test:e2e 2>&1 | tee -a ci-e2e.log

      - name: Refresh feature branch before reporting
        if: always() && github.event_name == 'push' && github.ref_name == 'feat/foundation-auth-data-model'
        shell: bash
        run: |
          git fetch origin "${{ github.ref_name }}"
          git checkout -B "${{ github.ref_name }}" "origin/${{ github.ref_name }}"

      - name: Write verification report
        if: always() && github.event_name == 'push' && github.ref_name == 'feat/foundation-auth-data-model'
        shell: bash
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          APP_RESULT: ${{ steps.app.outcome }}
          SUPABASE_CLI_RESULT: ${{ steps.supabase_cli.outcome }}
          DATABASE_RESULT: ${{ steps.database.outcome }}
          ENV_RESULT: ${{ steps.local_env.outcome }}
          E2E_RESULT: ${{ steps.e2e.outcome }}
        run: |
          mkdir -p ci-results
          {
            echo "# CI verification"
            echo
            echo "Commit: \`$GITHUB_SHA\`"
            echo
            echo "- Dependency install: **$INSTALL_RESULT**"
            echo "- App lint/typecheck/unit/build/audit: **$APP_RESULT**"
            echo "- Supabase CLI setup: **$SUPABASE_CLI_RESULT**"
            echo "- Database migrations/RLS: **$DATABASE_RESULT**"
            echo "- Local Supabase environment: **$ENV_RESULT**"
            echo "- Protected CRM E2E: **$E2E_RESULT**"
            echo
            for log in ci-install.log ci-app.log ci-database.log ci-e2e.log; do
              if [ -f "$log" ]; then
                echo "## $log"
                echo '```text'
                tail -n 180 "$log"
                echo '```'
                echo
              fi
            done
          } > ci-results/latest.md

      - name: Commit verification report and lockfile
        if: always() && github.event_name == 'push' && github.ref_name == 'feat/foundation-auth-data-model'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-results/latest.md
          if [ -f package-lock.json ]; then
            git add package-lock.json
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci-results: record verification for $GITHUB_SHA"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Fail workflow when verification failed
        if: always()
        shell: bash
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          APP_RESULT: ${{ steps.app.outcome }}
          SUPABASE_CLI_RESULT: ${{ steps.supabase_cli.outcome }}
          DATABASE_RESULT: ${{ steps.database.outcome }}
          ENV_RESULT: ${{ steps.local_env.outcome }}
          E2E_RESULT: ${{ steps.e2e.outcome }}
        run: |
          set -euo pipefail
          for result in "$INSTALL_RESULT" "$APP_RESULT" "$SUPABASE_CLI_RESULT" "$DATABASE_RESULT" "$ENV_RESULT" "$E2E_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "Verification did not fully succeed: $result"
              exit 1
            fi
          done
