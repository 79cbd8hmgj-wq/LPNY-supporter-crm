name: CI

on:
  push:
    paths-ignore:
      - "ci-results/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm install 2>&1 | tee ci-app.log
      - name: Verify application
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
        run: |
          set -o pipefail
          {
            npm run lint
            npm run typecheck
            npm test
            npm run build
          } 2>&1 | tee -a ci-app.log
      - name: Upload app output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-app-output
          path: |
            ci-app.log
            package-lock.json
          if-no-files-found: ignore

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify database migrations and RLS
        shell: bash
        run: |
          set -o pipefail
          {
            supabase start
            supabase db reset
            supabase test db
          } 2>&1 | tee ci-database.log
      - name: Upload database log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-database-output
          path: ci-database.log
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm install 2>&1 | tee ci-e2e.log
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        shell: bash
        run: |
          set -o pipefail
          {
            supabase start
            supabase db reset
          } 2>&1 | tee -a ci-e2e.log
      - name: Export local Supabase environment
        shell: bash
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY)=')"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
      - name: Verify protected CRM in browser
        shell: bash
        run: |
          set -o pipefail
          {
            npx playwright install --with-deps chromium
            npm run test:e2e
          } 2>&1 | tee -a ci-e2e.log
      - name: Upload E2E log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-e2e-output
          path: ci-e2e.log
          if-no-files-found: ignore

  report:
    if: always() && github.event_name == 'push' && github.ref_name == 'feat/foundation-auth-data-model'
    needs: [app, database, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verification outputs
        uses: actions/download-artifact@v4
        with:
          pattern: ci-*-output
          path: ci-outputs
      - name: Refresh feature branch
        shell: bash
        run: |
          git fetch origin "${{ github.ref_name }}"
          git checkout -B "${{ github.ref_name }}" "origin/${{ github.ref_name }}"
      - name: Write verification report
        shell: bash
        env:
          APP_RESULT: ${{ needs.app.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          lockfile="$(find ci-outputs -type f -name 'package-lock.json' | head -n 1)"
          if [ -n "$lockfile" ]; then
            cp "$lockfile" package-lock.json
          fi
          mkdir -p ci-results
          {
            echo "# CI verification"
            echo
            echo "Commit: \`$GITHUB_SHA\`"
            echo
            echo "- App: **$APP_RESULT**"
            echo "- Database/RLS: **$DATABASE_RESULT**"
            echo "- E2E: **$E2E_RESULT**"
            echo
            for log in $(find ci-outputs -type f -name '*.log' | sort); do
              echo "## $(basename "$log")"
              echo '```text'
              tail -n 120 "$log"
              echo '```'
              echo
            done
          } > ci-results/latest.md
      - name: Commit verification report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-results/latest.md package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci-results: record verification for $GITHUB_SHA"
          git push origin "HEAD:${{ github.ref_name }}"
