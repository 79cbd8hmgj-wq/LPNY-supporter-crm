# Temporary workflow to regenerate npm dependency metadata on a trusted branch.
# Remove this workflow once the lockfile update is committed.
name: Refresh production dependencies (one-time)
on:
  push:
    branches:
      - fix/staff-invitation-error-feedback-20261028
    paths:
      - .github/workflows/refresh-production-deps-once.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Regenerate manifest and lockfile with patched versions
        run: |
          set -euo pipefail
          npm install --save-exact next@16.4.3 eslint-config-next@16.4.3 zod@4.6.7
          npm audit fix --omit=dev
          npm audit --omit=dev --audit-level=high
      - name: Commit npm metadata only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes found"
            exit 1
          fi
          git commit -m "fix(security): update patched production dependencies and npm lockfile"
          git push origin HEAD:refs/heads/fix/staff-invitation-error-feedback-20261028
