name: Refresh Vitest 5 lockfile (one-time)

on:
  push:
    branches:
      - chore/vitest-5-dev-security-20261028
    paths:
      - .github/workflows/vitest-5-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == '79cbd8hmgj-wq/LPNY-supporter-crm'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/vitest-5-dev-security-20261028
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild lockfile with npm
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Apply available nonbreaking dependency security fixes
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund
      - name: Verify fresh installation
        run: npm ci --no-fund
      - name: Enforce full production and development dependency security audit
        run: npm audit --audit-level=high
      - name: Commit lockfile to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: regenerate npm lockfile for patched Vitest 5'
            git push origin HEAD:chore/vitest-5-dev-security-20261028
          fi
