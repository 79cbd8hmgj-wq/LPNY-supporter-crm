name: Staging E2E

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deployed-e2e
  cancel-in-progress: false

jobs:
  verify-staging:
    if: github.ref == 'refs/heads/staging'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BASE_URL: https://lpny-supporter-crm-git-staging-calypso-digital.vercel.app
      PLAYWRIGHT_TARGET_ENV: staging
      NEXT_PUBLIC_SUPABASE_URL: https://jcuxbutwcmgohyikpvcq.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_fFuzM9rofqDxv1oJ3llIhQ_MZF_H-EK
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.STAGING_VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate protected Staging target
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::STAGING_SUPABASE_SERVICE_ROLE_KEY is not configured in the GitHub staging environment"
            exit 1
          fi

          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            echo "::error::STAGING_VERCEL_AUTOMATION_BYPASS_SECRET is not configured in the GitHub staging environment"
            exit 1
          fi

          node <<'NODE'
          const expectedSupabaseHost = "jcuxbutwcmgohyikpvcq.supabase.co";
          const expectedAppHost = "lpny-supporter-crm-git-staging-calypso-digital.vercel.app";
          const supabase = new URL(process.env.NEXT_PUBLIC_SUPABASE_URL);
          const app = new URL(process.env.PLAYWRIGHT_BASE_URL);

          if (supabase.protocol !== "https:" || supabase.hostname !== expectedSupabaseHost) {
            throw new Error("Staging E2E is locked to the named LPNY Supporter CRM Staging Supabase project.");
          }

          if (app.protocol !== "https:" || app.hostname !== expectedAppHost) {
            throw new Error("Staging E2E is locked to the Vercel staging branch deployment.");
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Verify deployed release identity
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_READY=0

          for attempt in {1..30}; do
            if HEALTH_RESPONSE="$(curl --fail-with-body --location --silent --show-error \
              --retry 2 --retry-all-errors --connect-timeout 15 --max-time 30 \
              --header "cache-control: no-cache" \
              --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
              "${PLAYWRIGHT_BASE_URL%/}/api/health")"; then
              export HEALTH_RESPONSE

              if node <<'NODE'
          try {
            const health = JSON.parse(process.env.HEALTH_RESPONSE ?? "");

            if (health.dataEnvironment !== "staging") {
              console.error(
                `::error::Deployed application is not connected to the named Staging data environment (reported ${health.dataEnvironment ?? "unknown"}).`,
              );
              process.exit(2);
            }

            if (health.commitSha !== process.env.GITHUB_SHA) {
              console.log(
                `Staging is still serving ${health.commitSha ?? "null"}; expected ${process.env.GITHUB_SHA}.`,
              );
              process.exit(1);
            }
          } catch (error) {
            console.error(`::error::${error instanceof Error ? error.message : "Staging health verification failed"}`);
            process.exit(2);
          }
          NODE
              then
                DEPLOYMENT_READY=1
                break
              else
                verification_status=$?
                if [ "${verification_status}" -eq 2 ]; then
                  exit 1
                fi
              fi
            fi

            if [ "${attempt}" -lt 30 ]; then
              echo "Waiting for Vercel to serve ${GITHUB_SHA} (attempt ${attempt}/30)"
              sleep 10
            fi
          done

          if [ "${DEPLOYMENT_READY}" -ne 1 ]; then
            echo "::error::Staging did not reach the workflow commit before the deployment wait expired"
            exit 1
          fi

      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium webkit

      - name: Run deployed Staging browser E2E
        run: npm run test:e2e
