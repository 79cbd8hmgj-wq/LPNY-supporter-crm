name: Actions Smoke

on:
  push:
    branches:
      - feat/foundation-auth-data-model
    paths-ignore:
      - "ci-results/**"

permissions:
  contents: write

jobs:
  marker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record Actions execution
        shell: bash
        run: |
          git fetch origin "${{ github.ref_name }}"
          git checkout -B "${{ github.ref_name }}" "origin/${{ github.ref_name }}"
          mkdir -p ci-results
          printf '# GitHub Actions smoke\n\nWorkflow executed for `%s`.\n' "$GITHUB_SHA" > ci-results/actions-smoke.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-results/actions-smoke.md
          git commit -m "ci-results: confirm Actions execution for $GITHUB_SHA"
          git push origin "HEAD:${{ github.ref_name }}"
